<html>
    <head>
        <title></title>
        <style>
            *{
                margin: 0px;
                padding: 0px;
            }
            .contenedor{
                width: 400px;
                height: 200px;
                border: 1px solid black;
                position: relative;
                margin: 0 auto;
                overflow: hidden;
                background-image: url(img/campo.jpg);
            }
            .cuadrito{
                width: 50px;
                height: 50px;
                top: 150px;
                background-color: transparent;
                position: absolute;
                left: -50px;         
                animation: cuadrito 3s infinite linear;
            }
            .cuadrito2{
                width: 50px;
                height: 50px;
                top: 0px;
                background-color: blue;
                position: absolute;
                left: -50px;         
                animation: cuadrito2 3s infinite linear;
            }
            @keyframes cuadrito {
                0%{
                    left: -50px;
                    top: 150px;
                    rotate: 0deg;
                }50%{
                    top: 0px;
                    left: 175px;
                    rotate: 180px;
                }100%{
                    left: 400px;
                    top: 150px;
                    rotate: 180deg;
                }
            }
            @keyframes cuadrito2 {
                0%{
                    left: -50px;
                    top: 0px;
                    rotate: 0deg;
                }50%{
                    top: 150px;
                    left: 175px;
                    rotate: 180px;
                }100%{
                    left: 400px;
                    top: 0px;
                    rotate: 180deg;
                }
            }
        </style>
    </head>
    <body>
        <div class="contenedor">
            <div class="cuadrito">
                <img src="img/abejota.png" alt="" width="50px" height="50px">
            </div>

            <div class="cuadrito2"></div>
        </div>
    </body>
</html>
